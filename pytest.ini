[pytest]
# The default run is the CORE: money and safety of the paid path (see "Tests policy" in CLAUDE.md, scripts/test_policy.py).
# Everything else stays on disk and runs on request: pytest -m "" (all) or a file of the area.
addopts = -m core -q
markers =
    core: guards the paid path (payment, quote, request to KIE, faces); the default run
testpaths = comfy_nodes api_discovery/kie_kling
